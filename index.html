<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Google Workspace WebOS & Productivity Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- PDF.js for native client-side PDF rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      font-family: 'Google Sans', Roboto, sans-serif;
      touch-action: manipulation;
    }
    .touch-none {
      touch-action: none !important;
    }
    /* Hardware acceleration & smooth motion */
    .os-window {
      will-change: transform, width, height, left, top;
      transition: box-shadow 0.15s ease, opacity 0.15s ease;
      contain: layout style;
    }
    .os-window.is-animating {
      transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1), width 0.22s cubic-bezier(0.2, 0, 0, 1), height 0.22s cubic-bezier(0.2, 0, 0, 1), left 0.22s cubic-bezier(0.2, 0, 0, 1), top 0.22s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s ease;
    }
    .glass-shelf {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-panel {
      background: rgba(22, 30, 46, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .win-shadow {
      box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.14);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.4);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background-color: rgba(148, 163, 184, 0.7);
    }

    /* 8-Direction Window Resizers with Touch-Friendly Hitboxes */
    .resizer {
      position: absolute;
      z-index: 60;
      touch-action: none;
    }
    .resizer.r-top { top: -8px; left: 10px; right: 10px; height: 16px; cursor: ns-resize; }
    .resizer.r-bottom { bottom: -8px; left: 10px; right: 10px; height: 16px; cursor: ns-resize; }
    .resizer.r-left { left: -8px; top: 10px; bottom: 10px; width: 16px; cursor: ew-resize; }
    .resizer.r-right { right: -8px; top: 10px; bottom: 10px; width: 16px; cursor: ew-resize; }
    .resizer.r-topleft { top: -10px; left: -10px; width: 24px; height: 24px; cursor: nwse-resize; }
    .resizer.r-topright { top: -10px; right: -10px; width: 24px; height: 24px; cursor: nesw-resize; }
    .resizer.r-bottomleft { bottom: -10px; left: -10px; width: 24px; height: 24px; cursor: nesw-resize; }
    .resizer.r-bottomright { bottom: -10px; right: -10px; width: 24px; height: 24px; cursor: nwse-resize; }

    .sheet-cell:focus {
      outline: 2px solid #1a73e8 !important;
      background-color: #f0f7ff;
      z-index: 10;
    }
  </style>
</head>

  <script>
    /* Google Apps Script Code.gs content ready for user deployment */
    const CODE_GS_TEMPLATE = `/**
 * Google Workspace WebOS Backend Script (Code.gs)
 * Zero-Login direct data & file sync to Google Sheets & Google Drive.
 *
 * Instructions:
 * 1. Open https://script.google.com and create a new project.
 * 2. Paste this entire code into Code.gs.
 * 3. Click "Deploy" > "New deployment".
 * 4. Select Type: "Web App".
 * 5. Set "Execute as": "Me".
 * 6. Set "Who has access": "Anyone" (allows zero-login frontend access).
 * 7. Copy the Web App URL and paste it into the WebOS Settings App.
 */

function doPost(e) {
  try {
    var rawData = e.postData ? e.postData.contents : null;
    if (!rawData) {
      return responseJSON({ status: "error", message: "No post data received" });
    }
    var data = JSON.parse(rawData);
    var action = data.action || "saveEntry";
    var sheetName = data.sheetName || "General";
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName(sheetName);

    // Automatically create sheet if it doesn't exist
    if (!sheet) {
      sheet = ss.insertSheet(sheetName);
    }

    if (action === "saveFile" || data.fileBase64) {
      // Direct file storage to Google Drive folder
      var folderName = data.folderName || "WebOS_Uploads";
      var folders = DriveApp.getFoldersByName(folderName);
      var folder = folders.hasNext() ? folders.next() : DriveApp.createFolder(folderName);

      var contentType = data.contentType || "application/octet-stream";
      var decoded = Utilities.base64Decode(data.fileBase64);
      var blob = Utilities.newBlob(decoded, contentType, data.fileName || "file_" + new Date().getTime());
      var file = folder.createFile(blob);
      var fileUrl = file.getUrl();

      // Ensure headers exist
      ensureHeaders(sheet, ["Timestamp", "File Name", "File URL", "Content Type", "Size (bytes)"]);
      sheet.appendRow([new Date(), data.fileName, fileUrl, contentType, blob.getBytes().length]);

      return responseJSON({ status: "success", fileUrl: fileUrl, message: "File saved to Drive and logged to Sheet" });
    }

    // Dynamic Header & Row Insertion for Any App
    var rowData = data.payload || {};
    var keys = Object.keys(rowData);
    if (keys.length === 0) {
      return responseJSON({ status: "error", message: "Payload is empty" });
    }

    var headers = ["Timestamp"].concat(keys);
    ensureHeaders(sheet, headers);

    // Retrieve current header layout to place cells correctly
    var currentHeaders = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    var newRow = new Array(currentHeaders.length);
    newRow[0] = new Date();

    for (var i = 1; i < currentHeaders.length; i++) {
      var headerName = currentHeaders[i];
      newRow[i] = rowData[headerName] !== undefined ? rowData[headerName] : "";
    }

    sheet.appendRow(newRow);
    return responseJSON({ status: "success", sheet: sheetName, message: "Entry logged successfully" });
  } catch (err) {
    return responseJSON({ status: "error", message: err.toString() });
  }
}

function doGet(e) {
  return responseJSON({ status: "ready", service: "Google Workspace WebOS Backend API", timestamp: new Date() });
}

function ensureHeaders(sheet, requiredHeaders) {
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(requiredHeaders);
    sheet.getRange(1, 1, 1, requiredHeaders.length).setFontWeight("bold").setBackground("#e8f0fe");
    return;
  }
  var existingHeaders = sheet.getRange(1, 1, 1, Math.max(sheet.getLastColumn(), 1)).getValues()[0];
  var toAdd = [];
  requiredHeaders.forEach(function(h) {
    if (existingHeaders.indexOf(h) === -1) {
      toAdd.push(h);
    }
  });
  if (toAdd.length > 0) {
    var startCol = existingHeaders.length + 1;
    toAdd.forEach(function(h, idx) {
      sheet.getRange(1, startCol + idx).setValue(h).setFontWeight("bold").setBackground("#e8f0fe");
    });
  }
}

function responseJSON(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}`;

      init() {
        this.appRegistry = { ...this.defaultApps };
        this.loadCustomApps();
        this.setupDesktopIcons();
        this.setupLauncher();
        this.setupClock();
        this.setupGlobalEvents();
        this.checkMobileViewport();

        window.addEventListener('resize', () => {
          this.isMobile = window.innerWidth < 768;
          this.checkMobileViewport();
        });

        // Launch Docs on start
        setTimeout(() => {
          this.openApp('docs');
          if (!this.isMobile) this.openApp('scanner');
        }, 300);
      },

      /* Sound synthesized with Web Audio API (No external sound files) */
      playTone(freq = 440, type = 'sine', duration = 0.08) {
        if (!this.soundEnabled) return;
        try {
          if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
          }
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch (e) {}
      },

      toggleAudio() {
        this.soundEnabled = !this.soundEnabled;
        const btn = document.getElementById('btn-audio-toggle');
        if (btn) {
          btn.innerHTML = `<i class="fa-solid fa-volume-${this.soundEnabled ? 'high text-emerald-400' : 'xmark text-slate-400'}"></i> <span>Sound: ${this.soundEnabled ? 'ON' : 'OFF'}</span>`;
        }
        this.notify('Sound Settings', `Audio feedback is ${this.soundEnabled ? 'Enabled' : 'Muted'}`);
      },

      /* Zero-Login Google Sheet & Google Drive Sync via Apps Script */
      async syncToGoogleSheet(sheetName, payload, fileData = null) {
        const url = this.appsScriptUrl || localStorage.getItem('g_webos_script_url');
        const body = {
          sheetName: sheetName,
          payload: payload,
          action: fileData ? "saveFile" : "saveEntry"
        };
        if (fileData) {
          body.fileName = fileData.name;
          body.fileBase64 = fileData.base64;
          body.contentType = fileData.type || 'application/octet-stream';
          body.folderName = fileData.folder || 'Workspace_Drive';
        }

        if (!url) {
          // Fallback simulation mode
          console.log(`[Offline Fallback Sync to Sheet: ${sheetName}]`, body);
          this.notify('Cloud Saved (Local Cache)', `Saved to ${sheetName}. Connect your Code.gs script in Settings for live Google Drive sync.`);
          return { status: 'mock_success' };
        }

        try {
          this.notify('Google Sync', `Pushing to Google Sheet [${sheetName}]...`);
          const res = await fetch(url, {
            method: 'POST',
            mode: 'no-cors', // Standard cross-origin web app submission
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          this.playTone(880, 'sine', 0.12);
          this.notify('Google Cloud Synced', `Successfully synced entry to sheet: ${sheetName}`);
          return { status: 'success' };
        } catch (err) {
          console.error("Google sync error:", err);
          this.notify('Sync Error', 'Could not reach Apps Script endpoint. Stored locally.');
          return { status: 'error', error: err };
        }
      },

      checkMobileViewport() {
        if (this.isMobile) {
          Object.values(this.windows).forEach(win => {
            if (!win.maximized) {
              this.maximizeWindow(win, true);
            }
          });
        }
      },

      loadCustomApps() {
        try {
          const stored = localStorage.getItem('g_webos_custom_apps_v3');
          if (stored) {
            const list = JSON.parse(stored);
            list.forEach(app => this.registerApp(app, false));
          }
        } catch (e) {
          console.error(e);
        }
      },

      saveCustomApps() {
        const customs = Object.values(this.appRegistry)
          .filter(a => !a.isSystem)
          .map(a => ({
            id: a.id,
            name: a.name,
            icon: a.icon,
            color: a.color,
            code: a.code,
            isSystem: false
          }));
        localStorage.setItem('g_webos_custom_apps_v3', JSON.stringify(customs));
      },

      registerApp(appData, persist = true) {
        this.appRegistry[appData.id] = {
          id: appData.id,
          name: appData.name,
          icon: appData.icon || 'fa-solid fa-cube',
          color: appData.color || '#8b5cf6',
          isSystem: !!appData.isSystem,
          code: appData.code,
          defaultWidth: 780,
          defaultHeight: 540,
          render: (win) => {
            win.contentEl.innerHTML = `
              <div class="w-full h-full flex flex-col bg-white">
                <div class="h-8 bg-slate-100 border-b border-slate-200 px-3 flex items-center justify-between text-xs text-slate-600">
                  <span class="flex items-center gap-1.5"><i class="fa-solid fa-shield-halved text-emerald-600"></i> Sandboxed Environment</span>
                  <div class="flex items-center gap-2">
                    <button class="hover:text-slate-800 text-xs px-2 py-0.5 rounded bg-slate-200" onclick="OS.reloadCustomApp('${win.id}')"><i class="fa-solid fa-rotate-right"></i> Reload</button>
                    <button class="hover:text-red-600 text-xs px-2 py-0.5 rounded bg-rose-50 text-rose-600" onclick="OS.uninstallApp('${appData.id}')"><i class="fa-solid fa-trash"></i> Uninstall</button>
                  </div>
                </div>
                <iframe id="iframe-${win.id}" class="w-full flex-1 border-0" sandbox="allow-scripts allow-forms allow-modals"></iframe>
              </div>
            `;
            setTimeout(() => {
              const iframe = document.getElementById(`iframe-${win.id}`);
              if (iframe) iframe.srcdoc = appData.code || '<h1>App Loaded</h1>';
            }, 60);
          }
        };

        this.setupDesktopIcons();
        this.setupLauncher();
        if (persist) {
          this.saveCustomApps();
          this.notify('App Installed', `${appData.name} installed successfully.`);
        }
      },

      uninstallApp(appId) {
        const app = this.appRegistry[appId];
        if (!app) return;
        if (app.isSystem) {
          this.notify('System Protected', `${app.name} is a pre-installed system application.`);
          return;
        }

        const winIds = Object.keys(this.windows).filter(id => this.windows[id].appId === appId);
        winIds.forEach(id => this.closeWindow(id));

        delete this.appRegistry[appId];
        this.saveCustomApps();
        this.setupDesktopIcons();
        this.setupLauncher();

        const mgrWin = Object.values(this.windows).find(w => w.appId === 'manager');
        if (mgrWin) this.renderAppManager(mgrWin);

        this.notify('App Removed', `${app.name} has been uninstalled.`);
      },

      reloadCustomApp(winId) {
        const win = this.windows[winId];
        if (!win) return;
        const app = this.appRegistry[win.appId];
        const iframe = document.getElementById(`iframe-${winId}`);
        if (iframe && app && app.code) {
          iframe.srcdoc = app.code;
          this.notify(app.name, 'Reloaded sandbox');
        }
      },

      setupDesktopIcons() {
        const container = document.getElementById('desktop-icons');
        container.innerHTML = '';
        Object.values(this.appRegistry).forEach(app => {
          const el = document.createElement('div');
          el.className = 'w-18 sm:w-20 flex flex-col items-center justify-center p-2 rounded-2xl hover:bg-white/10 active:bg-white/20 text-white cursor-pointer transition transform active:scale-95 group text-center touch-manipulation select-none';
          el.innerHTML = `
            <div class="w-12 h-12 sm:w-13 sm:h-13 rounded-2xl flex items-center justify-center shadow-lg transition-transform group-hover:scale-105" style="background: ${app.color};">
              <i class="${app.icon} text-xl sm:text-2xl text-white"></i>
            </div>
            <span class="text-[11px] sm:text-xs font-medium mt-1.5 drop-shadow leading-tight line-clamp-2 px-1 text-slate-100">${app.name}</span>
          `;
          el.onclick = () => {
            this.playTone(520, 'triangle', 0.05);
            this.openApp(app.id);
          };
          this.bindContextMenu(el, app.id);
          container.appendChild(el);
        });
      },

      setupLauncher() {
        const grid = document.getElementById('launcher-app-grid');
        grid.innerHTML = '';
        Object.values(this.appRegistry).forEach(app => {
          const item = document.createElement('div');
          item.className = 'flex flex-col items-center justify-center p-2 rounded-xl hover:bg-slate-800 active:bg-slate-700 transition cursor-pointer text-center group';
          item.innerHTML = `
            <div class="w-11 h-11 rounded-xl flex items-center justify-center shadow transition-transform group-hover:scale-110" style="background: ${app.color};">
              <i class="${app.icon} text-lg text-white"></i>
            </div>
            <span class="text-[11px] font-medium mt-1.5 text-slate-200 line-clamp-1">${app.name}</span>
          `;
          item.onclick = () => {
            this.playTone(520, 'triangle', 0.05);
            this.openApp(app.id);
            this.toggleLauncher(false);
          };
          this.bindContextMenu(item, app.id);
          grid.appendChild(item);
        });

        const searchInput = document.getElementById('launcher-search');
        searchInput.oninput = (e) => {
          const q = e.target.value.toLowerCase();
          Array.from(grid.children).forEach(child => {
            child.style.display = child.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
          });
        };
      },

      bindContextMenu(element, appId) {
        let pressTimer = null;
        element.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          this.showContextMenu(e.clientX, e.clientY, appId);
        });

        element.addEventListener('touchstart', (e) => {
          pressTimer = setTimeout(() => {
            const touch = e.touches[0];
            this.showContextMenu(touch.clientX, touch.clientY, appId);
          }, 550);
        }, { passive: true });

        const cancel = () => { if (pressTimer) clearTimeout(pressTimer); };
        element.addEventListener('touchend', cancel);
        element.addEventListener('touchmove', cancel);
      },

      showContextMenu(x, y, appId) {
        const menu = document.getElementById('app-context-menu');
        const app = this.appRegistry[appId];
        if (!app) return;

        this.contextTargetAppId = appId;
        document.getElementById('ctx-app-title').innerText = app.name;
        const btn = document.getElementById('ctx-btn-uninstall');

        if (app.isSystem) {
          btn.classList.add('opacity-40', 'pointer-events-none');
          btn.innerHTML = `<i class="fa-solid fa-lock text-[10px]"></i> System App`;
        } else {
          btn.classList.remove('opacity-40', 'pointer-events-none');
          btn.innerHTML = `<i class="fa-solid fa-trash text-[10px]"></i> Uninstall App`;
        }

        const clampedX = Math.min(x, window.innerWidth - 190);
        const clampedY = Math.min(y, window.innerHeight - 120);
        menu.style.left = `${clampedX}px`;
        menu.style.top = `${clampedY}px`;
        menu.classList.remove('hidden');
      },

      toggleLauncher(force) {
        const launcher = document.getElementById('app-launcher');
        const isHidden = launcher.classList.contains('hidden');
        const show = force !== undefined ? force : isHidden;
        if (show) {
          launcher.classList.remove('hidden');
          document.getElementById('quick-settings-panel').classList.add('hidden');
          document.getElementById('launcher-search').focus();
        } else {
          launcher.classList.add('hidden');
        }
      },

      toggleQuickSettings() {
        const panel = document.getElementById('quick-settings-panel');
        panel.classList.toggle('hidden');
        document.getElementById('app-launcher').classList.add('hidden');
      },

      toggleWallpaper() {
        this.currentWallpaperIndex = (this.currentWallpaperIndex + 1) % this.wallpapers.length;
        document.getElementById('desktop-bg').style.background = this.wallpapers[this.currentWallpaperIndex];
        this.notify('Wallpaper', 'Theme refreshed');
      },

      setupClock() {
        const dClock = document.getElementById('live-clock');
        const mClock = document.getElementById('mobile-clock');
        const tick = () => {
          const d = new Date();
          const str = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          if (dClock) dClock.innerText = str;
          if (mClock) mClock.innerText = str;
        };
        tick();
        setInterval(tick, 1000);
      },

      setupGlobalEvents() {
        document.getElementById('launcher-trigger').onclick = (e) => {
          e.stopPropagation();
          this.toggleLauncher();
        };

        document.getElementById('system-tray-btn').onclick = (e) => {
          e.stopPropagation();
          this.toggleQuickSettings();
        };

        document.getElementById('ctx-btn-open').onclick = () => {
          if (this.contextTargetAppId) this.openApp(this.contextTargetAppId);
          document.getElementById('app-context-menu').classList.add('hidden');
        };

        document.getElementById('ctx-btn-uninstall').onclick = () => {
          if (this.contextTargetAppId) this.uninstallApp(this.contextTargetAppId);
          document.getElementById('app-context-menu').classList.add('hidden');
        };

        document.addEventListener('pointerdown', (e) => {
          if (!e.target.closest('#app-launcher') && !e.target.closest('#launcher-trigger')) {
            this.toggleLauncher(false);
          }
          if (!e.target.closest('#quick-settings-panel') && !e.target.closest('#system-tray-btn')) {
            document.getElementById('quick-settings-panel').classList.add('hidden');
          }
          if (!e.target.closest('#app-context-menu')) {
            document.getElementById('app-context-menu').classList.add('hidden');
          }
        });
      },

      notify(title, msg) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'glass-panel text-white px-3.5 py-2.5 rounded-xl border border-white/10 shadow-2xl flex items-center justify-between gap-3 text-xs pointer-events-auto transition-all duration-300';
        toast.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-6 h-6 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">
              <i class="fa-solid fa-bell text-[10px]"></i>
            </div>
            <div>
              <div class="font-bold text-slate-100">${title}</div>
              <div class="text-[11px] text-slate-300">${msg}</div>
            </div>
          </div>
          <button class="text-slate-400 hover:text-white" onclick="this.parentElement.remove()">&times;</button>
        `;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 250);
        }, 3500);
      },

      /* Window Management with 60fps Hardware Accelerated PointerEvents */
      openApp(appId) {
        const app = this.appRegistry[appId];
        if (!app) return;

        const existingWinId = Object.keys(this.windows).find(id => this.windows[id].appId === appId);
        if (existingWinId) {
          const win = this.windows[existingWinId];
          win.minimized = false;
          win.el.classList.remove('hidden');
          this.focusWindow(existingWinId);
          return;
        }

        const winId = 'win_' + Math.random().toString(36).substring(2, 9);
        const winEl = document.createElement('div');
        winEl.id = winId;
        winEl.className = 'os-window absolute bg-white rounded-xl win-shadow flex flex-col overflow-hidden pointer-events-auto border border-slate-700/30';

        const isMobileScreen = window.innerWidth < 640;
        const width = isMobileScreen ? window.innerWidth : Math.min(app.defaultWidth, window.innerWidth - 40);
        const height = isMobileScreen ? window.innerHeight - 56 : Math.min(app.defaultHeight, window.innerHeight - 80);
        const left = isMobileScreen ? 0 : Math.max(10, 20 + (Object.keys(this.windows).length % 7) * 26);
        const top = isMobileScreen ? 0 : Math.max(10, 16 + (Object.keys(this.windows).length % 7) * 26);

        winEl.style.width = `${width}px`;
        winEl.style.height = `${height}px`;
        winEl.style.left = `${left}px`;
        winEl.style.top = `${top}px`;

        winEl.innerHTML = `
          <div class="resizer r-top" data-dir="top"></div>
          <div class="resizer r-bottom" data-dir="bottom"></div>
          <div class="resizer r-left" data-dir="left"></div>
          <div class="resizer r-right" data-dir="right"></div>
          <div class="resizer r-topleft" data-dir="topleft"></div>
          <div class="resizer r-topright" data-dir="topright"></div>
          <div class="resizer r-bottomleft" data-dir="bottomleft"></div>
          <div class="resizer r-bottomright" data-dir="bottomright"></div>

          <div class="window-titlebar h-10 bg-slate-100 border-b border-slate-200 px-3 flex items-center justify-between select-none touch-none cursor-move">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-800 truncate">
              <i class="${app.icon}" style="color: ${app.color};"></i>
              <span class="truncate max-w-[170px] sm:max-w-xs">${app.name}</span>
            </div>
            <div class="flex items-center gap-1">
              <button class="btn-win-minimize w-7 h-7 rounded-lg hover:bg-slate-200 active:bg-slate-300 flex items-center justify-center text-slate-600 text-xs transition">
                <i class="fa-solid fa-minus"></i>
              </button>
              <button class="btn-win-maximize w-7 h-7 rounded-lg hover:bg-slate-200 active:bg-slate-300 flex items-center justify-center text-slate-600 text-xs transition">
                <i class="fa-regular fa-square"></i>
              </button>
              <button class="btn-win-close w-7 h-7 rounded-lg hover:bg-rose-500 hover:text-white active:bg-rose-600 flex items-center justify-center text-slate-600 text-xs transition">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <div class="window-content flex-1 overflow-hidden relative bg-white"></div>
        `;

        document.getElementById('windows-container').appendChild(winEl);

        const winObj = {
          id: winId,
          appId: appId,
          el: winEl,
          titlebar: winEl.querySelector('.window-titlebar'),
          contentEl: winEl.querySelector('.window-content'),
          minimized: false,
          maximized: false,
          prevRect: null
        };

        this.windows[winId] = winObj;
        app.render(winObj);

        this.bindPointerDrag(winObj);
        this.bindPointerResize(winObj);
        this.bindWindowControls(winObj);
        this.createTaskbarTab(winObj);

        if (isMobileScreen) {
          this.maximizeWindow(winObj, true);
        }

        this.focusWindow(winId);
      },

      focusWindow(winId) {
        this.zIndexCounter += 2;
        const win = this.windows[winId];
        if (!win) return;
        win.el.style.zIndex = this.zIndexCounter;
        this.activeWindowId = winId;
        this.updateTaskbarTabs();
      },

      bindWindowControls(win) {
        win.el.addEventListener('pointerdown', () => this.focusWindow(win.id));

        const minBtn = win.el.querySelector('.btn-win-minimize');
        const maxBtn = win.el.querySelector('.btn-win-maximize');
        const closeBtn = win.el.querySelector('.btn-win-close');

        minBtn.onclick = (e) => {
          e.stopPropagation();
          win.minimized = true;
          win.el.classList.add('hidden');
          this.updateTaskbarTabs();
        };

        maxBtn.onclick = (e) => {
          e.stopPropagation();
          this.maximizeWindow(win);
        };

        closeBtn.onclick = (e) => {
          e.stopPropagation();
          this.closeWindow(win.id);
        };

        let lastTap = 0;
        win.titlebar.addEventListener('pointerup', (e) => {
          if (e.target.closest('button')) return;
          const now = Date.now();
          if (now - lastTap < 300) {
            this.maximizeWindow(win);
          }
          lastTap = now;
        });
      },

      maximizeWindow(win, forceMax = null) {
        const shouldMax = forceMax !== null ? forceMax : !win.maximized;
        win.el.classList.add('is-animating');

        if (shouldMax) {
          win.prevRect = {
            left: win.el.style.left,
            top: win.el.style.top,
            width: win.el.style.width,
            height: win.el.style.height
          };
          win.el.style.left = '0px';
          win.el.style.top = '0px';
          win.el.style.width = '100vw';
          const bottomMargin = window.innerWidth < 768 ? 56 : 48;
          win.el.style.height = `calc(100vh - ${bottomMargin}px)`;
          win.el.classList.remove('rounded-xl');
          win.maximized = true;
          win.el.querySelector('.btn-win-maximize i').className = 'fa-regular fa-window-restore';
        } else {
          if (win.prevRect) {
            win.el.style.left = win.prevRect.left;
            win.el.style.top = win.prevRect.top;
            win.el.style.width = win.prevRect.width;
            win.el.style.height = win.prevRect.height;
          }
          win.el.classList.add('rounded-xl');
          win.maximized = false;
          win.el.querySelector('.btn-win-maximize i').className = 'fa-regular fa-square';
        }
        setTimeout(() => win.el.classList.remove('is-animating'), 230);
      },

      closeWindow(winId) {
        const win = this.windows[winId];
        if (!win) return;
        win.el.remove();
        delete this.windows[winId];
        this.removeTaskbarTab(winId);
      },

      bindPointerDrag(win) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        const onPointerDown = (e) => {
          if (win.maximized) return;
          if (e.target.closest('button')) return;

          isDragging = true;
          this.focusWindow(win.id);
          startX = e.clientX;
          startY = e.clientY;
          initialLeft = win.el.offsetLeft;
          initialTop = win.el.offsetTop;

          win.titlebar.setPointerCapture(e.pointerId);
          win.titlebar.addEventListener('pointermove', onPointerMove);
          win.titlebar.addEventListener('pointerup', onPointerUp);
          win.titlebar.addEventListener('pointercancel', onPointerUp);
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const maxTop = window.innerHeight - 100;
          win.el.style.left = `${initialLeft + dx}px`;
          win.el.style.top = `${Math.max(0, Math.min(initialTop + dy, maxTop))}px`;
        };

        const onPointerUp = (e) => {
          if (!isDragging) return;
          isDragging = false;
          try { win.titlebar.releasePointerCapture(e.pointerId); } catch (err) {}
          win.titlebar.removeEventListener('pointermove', onPointerMove);
          win.titlebar.removeEventListener('pointerup', onPointerUp);
          win.titlebar.removeEventListener('pointercancel', onPointerUp);
        };

        win.titlebar.addEventListener('pointerdown', onPointerDown);
      },

      bindPointerResize(win) {
        const handles = win.el.querySelectorAll('.resizer');
        handles.forEach(handle => {
          const dir = handle.getAttribute('data-dir');
          handle.addEventListener('pointerdown', (e) => {
            if (win.maximized) return;
            e.preventDefault();
            e.stopPropagation();

            this.focusWindow(win.id);
            const startX = e.clientX;
            const startY = e.clientY;
            const initialW = win.el.offsetWidth;
            const initialH = win.el.offsetHeight;
            const initialLeft = win.el.offsetLeft;
            const initialTop = win.el.offsetTop;

            handle.setPointerCapture(e.pointerId);

            const onPointerMove = (ev) => {
              const dx = ev.clientX - startX;
              const dy = ev.clientY - startY;
              let newW = initialW;
              let newH = initialH;
              let newLeft = initialLeft;
              let newTop = initialTop;

              const minW = 280;
              const minH = 200;

              if (dir.includes('right')) newW = Math.max(minW, initialW + dx);
              if (dir.includes('bottom')) newH = Math.max(minH, initialH + dy);
              if (dir.includes('left')) {
                const calcW = initialW - dx;
                if (calcW > minW) { newW = calcW; newLeft = initialLeft + dx; }
              }
              if (dir.includes('top')) {
                const calcH = initialH - dy;
                if (calcH > minH) { newH = calcH; newTop = initialTop + dy; }
              }

              win.el.style.width = `${newW}px`;
              win.el.style.height = `${newH}px`;
              win.el.style.left = `${newLeft}px`;
              win.el.style.top = `${newTop}px`;
            };

            const onPointerUp = (ev) => {
              try { handle.releasePointerCapture(ev.pointerId); } catch (err) {}
              handle.removeEventListener('pointermove', onPointerMove);
              handle.removeEventListener('pointerup', onPointerUp);
              handle.removeEventListener('pointercancel', onPointerUp);
            };

            handle.addEventListener('pointermove', onPointerMove);
            handle.addEventListener('pointerup', onPointerUp);
            handle.addEventListener('pointercancel', onPointerUp);
          });
        });

      createTaskbarTab(win) {
        const app = this.appRegistry[win.appId];
        const container = document.getElementById('taskbar-apps');
        const tab = document.createElement('button');
        tab.id = `tab-${win.id}`;
        tab.className = 'flex items-center gap-2 px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-800/90 text-white text-xs border border-white/5 transition relative flex-shrink-0';

          <div class="indicator w-1.5 h-1.5 rounded-full bg-blue-400 absolute bottom-0.5 left-1/2 -translate-x-1/2"></div>
        `;

        tab.onclick = () => {
          if (win.minimized) {
            win.minimized = false;
            win.el.classList.remove('hidden');
            this.focusWindow(win.id);
          } else if (this.activeWindowId === win.id) {
            win.minimized = true;
            win.el.classList.add('hidden');
          } else {
            this.focusWindow(win.id);
          }
          this.updateTaskbarTabs();
        };

        container.appendChild(tab);
        this.updateTaskbarTabs();

      removeTaskbarTab(winId) {
        const tab = document.getElementById(`tab-${winId}`);

      updateTaskbarTabs() {
        Object.values(this.windows).forEach(win => {
          const tab = document.getElementById(`tab-${win.id}`);

          const ind = tab.querySelector('.indicator');
          if (this.activeWindowId === win.id && !win.minimized) {
            tab.classList.add('bg-slate-700', 'border-blue-500/80');
            ind.style.opacity = '1';

      /* 2. GOOGLE SHEETS (Dynamic Formulas, CSV Export, Sync to Cloud) */
      renderSheets(win) {
        const cols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        const rows = 22;
        const initData = {
          'A1': 'Product', 'B1': 'Sales Rep', 'C1': 'Units Sold', 'D1': 'Price ($)', 'E1': 'Revenue ($)',
          'A2': 'Pixel 9 Pro', 'B2': 'Alex Chen', 'C2': '150', 'D2': '999', 'E2': '149850',
          'A3': 'Pixel Tablet', 'B3': 'Sarah Jenkins', 'C3': '220', 'D3': '499', 'E3': '109780',
          'A4': 'Chromebook Max', 'B4': 'David Miller', 'C4': '310', 'D4': '699', 'E4': '216690',
          'A5': 'Nest Audio Hub', 'B5': 'Sarah Jenkins', 'C5': '540', 'D5': '99', 'E5': '53460',
        };

        let html = `
          <div class="flex flex-col h-full bg-white text-xs">
            <!-- Toolbar & Cloud Push -->
            <div class="bg-slate-50 border-b border-slate-200 px-3 py-1.5 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <div id="sheets-cell-ref-${win.id}" class="w-12 font-mono font-bold text-center bg-white border border-slate-300 py-1 rounded text-slate-700">A1</div>
                <span class="text-slate-400 font-mono italic">fx</span>
                <input id="sheets-fx-${win.id}" type="text" placeholder="Type value or formula: =SUM(E2:E5)" class="w-48 sm:w-80 bg-white border border-slate-300 rounded px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-600 focus:outline-none">
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="OS.syncSheetToDrive('${win.id}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-cloud-arrow-up text-[10px]"></i> Sync Rows to Google
                </button>
                <button onclick="OS.exportSheetCSV('${win.id}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs font-semibold flex items-center gap-1">
                  <i class="fa-solid fa-file-csv text-[10px]"></i> Export CSV
                </button>
              </div>
            </div>

            <!-- Spreadsheets Matrix Table -->
            <div class="flex-1 overflow-auto custom-scroll">
              <table id="sheets-table-${win.id}" class="border-collapse w-full border border-slate-300">
                <thead>
                  <tr class="bg-slate-100 text-slate-600 font-semibold sticky top-0 z-20">
                    <th class="w-10 border border-slate-300 p-1 text-center bg-slate-200">#</th>
                    ${cols.map(c => `<th class="w-28 border border-slate-300 p-1 text-center">${c}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
        `;

        for (let r = 1; r <= rows; r++) {
          html += `<tr><td class="bg-slate-100 border border-slate-300 text-center font-bold text-slate-500">${r}</td>`;
          cols.forEach(c => {
            const cid = `${c}${r}`;
            const val = initData[cid] || '';
            html += `<td id="${win.id}-${cid}" data-coord="${cid}" contenteditable="true" class="sheet-cell border border-slate-200 p-1.5 font-mono text-slate-800">${val}</td>`;
          });
          html += `</tr>`;
        }

        html += `
                </tbody>
              </table>
            </div>
            <div class="h-6 bg-slate-100 border-t border-slate-200 px-3 flex items-center justify-between text-[11px] text-slate-500">
              <span class="font-bold text-emerald-700">Sheet 1</span>
              <span>Supports =SUM(), =AVERAGE(), =MIN(), =MAX()</span>
            </div>
          </div>
        `;

        win.contentEl.innerHTML = html;

        const fxInput = document.getElementById(`sheets-fx-${win.id}`);
        const refLabel = document.getElementById(`sheets-cell-ref-${win.id}`);

        win.contentEl.querySelectorAll('.sheet-cell').forEach(cell => {
          cell.addEventListener('focus', () => {
            const coord = cell.getAttribute('data-coord');
            refLabel.innerText = coord;
            fxInput.value = cell.innerText;
          });
          cell.addEventListener('blur', () => {
            OS.evaluateSheetFormula(win.id, cell);
          });
          cell.addEventListener('input', () => {
            fxInput.value = cell.innerText;
          });
        });

        fxInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const coord = refLabel.innerText;
            const target = document.getElementById(`${win.id}-${coord}`);
            if (target) {
              target.innerText = fxInput.value;
              OS.evaluateSheetFormula(win.id, target);
            }
          }
        });
      },

      evaluateSheetFormula(winId, cell) {
        const raw = cell.innerText.trim();
        if (!raw.startsWith('=')) return;

        const expr = raw.substring(1).toUpperCase();
        try {
          if (expr.startsWith('SUM(')) {
            const range = expr.replace('SUM(', '').replace(')', '').split(':');
            const total = this.calculateSheetRange(winId, range[0], range[1], 'sum');
            cell.innerText = total;
          } else if (expr.startsWith('AVERAGE(')) {
            const range = expr.replace('AVERAGE(', '').replace(')', '').split(':');
            const avg = this.calculateSheetRange(winId, range[0], range[1], 'avg');
            cell.innerText = avg.toFixed(2);
          }
        } catch (err) {
          cell.innerText = '#VALUE!';
        }
      },

      calculateSheetRange(winId, start, end, mode) {
        const startCol = start.charAt(0);
        const startRow = parseInt(start.substring(1));
        const endCol = end.charAt(0);
        const endRow = parseInt(end.substring(1));

        let vals = [];
        for (let r = startRow; r <= endRow; r++) {
          const cid = `${startCol}${r}`;
          const el = document.getElementById(`${winId}-${cid}`);
          if (el) {
            const num = parseFloat(el.innerText);
            if (!isNaN(num)) vals.push(num);
          }
        }
        if (vals.length === 0) return 0;
        if (mode === 'sum') return vals.reduce((a, b) => a + b, 0);
        if (mode === 'avg') return vals.reduce((a, b) => a + b, 0) / vals.length;
        return 0;
      },

      syncSheetToDrive(winId) {
        const table = document.getElementById(`sheets-table-${winId}`);
        if (!table) return;
        const rows = [];
        table.querySelectorAll('tbody tr').forEach((tr, idx) => {
          const cells = Array.from(tr.querySelectorAll('td')).slice(1).map(td => td.innerText.trim());
          if (cells.some(c => c !== '')) {
            rows.push({
              RowIndex: idx + 1,
              A: cells[0] || '',
              B: cells[1] || '',
              C: cells[2] || '',
              D: cells[3] || '',
              E: cells[4] || ''
            });
          }
        });
        this.syncToGoogleSheet('Spreadsheets', {
          TotalRowsCount: rows.length,
          FirstRowPreview: JSON.stringify(rows[0] || {}),
          Summary: `Synced ${rows.length} rows from Google Sheets app`
        });
      },

      exportSheetCSV(winId) {
        const table = document.getElementById(`sheets-table-${winId}`);
        if (!table) return;
        let csv = "";
        table.querySelectorAll('tr').forEach(tr => {
          const rowData = Array.from(tr.querySelectorAll('th, td')).slice(1).map(c => `"${c.innerText.replace(/"/g, '""')}"`);
          csv += rowData.join(',') + "\r\n";
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Google-Sheet-Data.csv';
        a.click();
        this.notify('Google Sheets', 'CSV Exported');
      },

      async startScannerCamera(winId) {
        const vid = document.getElementById(`scanner-video-preview-${winId}`);
        if (!vid) return;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          vid.srcObject = stream;
        } catch (err) {
          this.notify('Camera Access', 'Using synthetic document scanner mode (no webcam permission).');
          // Draw mock placeholder document on output canvas
          const canvas = document.getElementById(`scanner-output-canvas-${winId}`);
          if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = 300;
            canvas.height = 400;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 300, 400);
            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('Workspace Invoice Document', 20, 50);
            ctx.font = '12px sans-serif';
            ctx.fillText('Invoice #: INV-2026-0987', 20, 80);
            ctx.fillText('Status: Approved & Verified', 20, 105);
            ctx.fillRect(20, 120, 260, 2);
            ctx.fillStyle = '#475569';
            ctx.fillText('Google Cloud Apps Script backend ready.', 20, 150);
          }
        }
      },

      captureScannerDoc(winId) {
        const vid = document.getElementById(`scanner-video-preview-${winId}`);
        const canvas = document.getElementById(`scanner-output-canvas-${winId}`);
        const filter = document.getElementById(`scanner-filter-${winId}`).value;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const w = vid.videoWidth || 640;
        const h = vid.videoHeight || 480;
        canvas.width = w;
        canvas.height = h;

        if (vid.srcObject) {
          ctx.drawImage(vid, 0, 0, w, h);
        } else {
          // Synthetic high-res invoice
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 24px sans-serif';
          ctx.fillText('SCANNED WORKSPACE DOCUMENT', 40, 80);
          ctx.font = '16px monospace';
          ctx.fillText(`Timestamp: ${new Date().toLocaleString()}`, 40, 120);
          ctx.fillText('All headers synced via Google Apps Script', 40, 150);
        }

        // Apply Image Filters (Contrast/B&W)
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          const avg = (d[i] + d[i + 1] + d[i + 2]) / 3;
          if (filter === 'contrast') {
            const bw = avg > 128 ? 255 : 0;
            d[i] = bw; d[i + 1] = bw; d[i + 2] = bw;
          } else if (filter === 'grayscale') {
            d[i] = avg; d[i + 1] = avg; d[i + 2] = avg;
          }
        }
        ctx.putImageData(imgData, 0, 0);
        this.playTone(660, 'square', 0.08);
        this.notify('Scanner', 'Document captured and processed');
      },

      downloadScannedDoc(winId) {
        const canvas = document.getElementById(`scanner-output-canvas-${winId}`);
        if (!canvas) return;
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `Scanned-Document-${Date.now()}.png`;
        a.click();
      },

        const canvas = document.getElementById(`scanner-output-canvas-${winId}`);

        const base64 = canvas.toDataURL('image/png').split(',')[1];

        const inp = document.getElementById('setting-script-url');
        if (!inp) return;
        const val = inp.value.trim();
        this.appsScriptUrl = val;
        localStorage.setItem('g_webos_script_url', val);
        const pill = document.getElementById('backend-status-pill');
        if (pill) {
          pill.innerText = val ? 'Cloud Synced' : 'Sheet Ready';
        }
        this.notify('Google Apps Script URL', 'Saved successfully. Ready for zero-login sync.');
      },

      copyCodeGs() {
        const textarea = document.getElementById('code-gs-view');
        if (!textarea) return;
        textarea.select();
        document.execCommand('copy');
        this.notify('Copied', 'Code.gs copied to clipboard. Ready to paste into script.google.com');
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      OS.init();
    });
  </script>
</body>
</html>
